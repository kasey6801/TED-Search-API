[project]
name = "ted-search-api"
version = "0.0.1"
description = "Async Python client and MCP server for the EU TED Search API (Tenders Electronic Daily)."
readme = "DESIGN.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "kasey6801" }]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "typer>=0.12",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
ted-search = "ted_search_api.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-recording>=0.13",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ted_search_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ted_search_api"]
